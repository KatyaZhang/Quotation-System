<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bangpu水泵智能报价查询系统</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#eef2f8;color:#1f2937;min-height:100vh;
  }
  .hero{
    background:linear-gradient(135deg,#0f2f6b 0%,#1d4ed8 55%,#0891b2 100%);
    color:#fff;padding:46px 20px 78px;text-align:center;position:relative;overflow:hidden;
  }
  .hero::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 15% 20%,rgba(255,255,255,.16),transparent 45%),
               radial-gradient(circle at 85% 80%,rgba(255,255,255,.12),transparent 45%);
    pointer-events:none;
  }
  .hero h1{font-size:30px;letter-spacing:1px;font-weight:700;position:relative;z-index:1}
  .hero p{margin-top:10px;font-size:14px;opacity:.85;position:relative;z-index:1}
  .wrap{max-width:1080px;margin:-52px auto 60px;padding:0 16px;position:relative;z-index:2}

  .card{background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(15,47,107,.10);padding:22px}
  .search-card{margin-bottom:20px}

  .search-row{display:flex;gap:10px;flex-wrap:wrap}
  #q{
    flex:1 1 320px;min-width:200px;height:52px;border:2px solid #e2e8f0;border-radius:12px;
    padding:0 16px;font-size:16px;outline:none;transition:.2s;background:#f8fafc;
  }
  #q:focus{border-color:#2563eb;background:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.12)}
  select{
    height:52px;border:2px solid #e2e8f0;border-radius:12px;padding:0 12px;font-size:15px;
    background:#f8fafc;outline:none;cursor:pointer;color:#334155;max-width:180px;
  }
  select:focus{border-color:#2563eb}
  button{
    height:52px;padding:0 26px;border:none;border-radius:12px;cursor:pointer;font-size:16px;
    font-weight:600;color:#fff;background:linear-gradient(135deg,#2563eb,#0891b2);
    transition:.18s;white-space:nowrap;
  }
  button:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(37,99,235,.32)}
  button:active{transform:translateY(0)}
  button.ghost{background:#eef2f8;color:#334155}
  button.ghost:hover{background:#e0e7f3;box-shadow:none}
  button.danger{background:#fee2e2;color:#dc2626;height:34px;padding:0 12px;font-size:13px;border-radius:8px}
  button.danger:hover{background:#fecaca;box-shadow:none;transform:none}

  .quick{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .quick span.lbl{font-size:13px;color:#94a3b8}
  .chip{
    padding:6px 13px;border-radius:999px;background:#eef4ff;color:#2563eb;font-size:13px;
    cursor:pointer;border:1px solid #dbeafe;transition:.15s;user-select:none;
  }
  .chip:hover{background:#2563eb;color:#fff;border-color:#2563eb}

  .stats{display:flex;gap:24px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px dashed #e2e8f0}
  .stat b{display:block;font-size:22px;color:#1d4ed8}
  .stat span{font-size:12px;color:#94a3b8}

  h2.sec{font-size:16px;margin:26px 0 12px;color:#0f172a;display:flex;align-items:center;gap:8px}
  h2.sec::before{content:"";width:4px;height:16px;border-radius:2px;background:linear-gradient(#2563eb,#0891b2)}

  .res{display:grid;gap:12px}
  .res-card{
    background:#fff;border-radius:14px;padding:16px 18px;box-shadow:0 4px 14px rgba(15,47,107,.07);
    border-left:4px solid #2563eb;transition:.18s;
  }
  .res-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(15,47,107,.13)}
  .res-card.self{border-left-color:#10b981}
  .res-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .model{font-size:17px;font-weight:700;color:#0f172a;letter-spacing:.3px;word-break:break-all}
  .badge{font-size:12px;padding:2px 9px;border-radius:6px;background:#e0f2fe;color:#0369a1;font-weight:600}
  .badge.own{background:#d1fae5;color:#047857}
  .match{margin-left:auto;font-size:12px;color:#94a3b8;white-space:nowrap}
  .price{font-size:24px;font-weight:800;color:#dc2626;margin-top:8px;letter-spacing:.5px}
  .price small{font-size:13px;font-weight:500;color:#94a3b8;margin-left:8px}
  .meta{font-size:12.5px;color:#94a3b8;margin-top:6px}

  .empty{background:#fff;border-radius:14px;padding:40px 20px;text-align:center;color:#94a3b8;box-shadow:0 4px 14px rgba(15,47,107,.07)}
  .empty b{display:block;color:#334155;font-size:16px;margin-bottom:8px}

  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  .field label{display:block;font-size:12.5px;color:#64748b;margin-bottom:6px;font-weight:500}
  .field input{
    width:100%;height:44px;border:2px solid #e2e8f0;border-radius:10px;padding:0 12px;
    font-size:15px;outline:none;background:#f8fafc;transition:.18s;
  }
  .field input:focus{border-color:#2563eb;background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
  .form-actions{display:flex;gap:10px;margin-top:16px;align-items:center;flex-wrap:wrap}
  .toast{font-size:13.5px;font-weight:600;padding:8px 14px;border-radius:8px;display:none}
  .toast.ok{display:inline-block;background:#dcfce7;color:#15803d}
  .toast.err{display:inline-block;background:#fee2e2;color:#b91c1c}

  .own-list{display:grid;gap:8px;margin-top:14px}
  .own-item{
    display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;background:#f8fafc;
    border:1px solid #e8eef7;font-size:14px;flex-wrap:wrap;
  }
  .own-item .n{font-weight:600;color:#0f172a}
  .own-item .s{font-size:12px;color:#64748b;background:#e0f2fe;padding:1px 8px;border-radius:5px}
  .own-item .p{margin-left:auto;color:#dc2626;font-weight:700}
  .hint{font-size:12.5px;color:#94a3b8;margin-top:10px;line-height:1.7}
  @media(max-width:560px){
    .hero h1{font-size:23px}
    .price{font-size:20px}
    #q,select,button{height:48px}
  }
</style>
</head>
<body>

<div class="hero">
  <h1>💧 水泵智能报价查询系统</h1>
  <p>输入型号，即刻获取相同 / 相似型号的指导报价</p>
</div>

<div class="wrap">

  <!-- 搜索区 -->
  <div class="card search-card">
    <div class="search-row">
      <input id="q" placeholder="请输入型号，如：200AFP400、BPO250-470、200QJ65-90 …" autocomplete="off">
      <select id="series"><option value="">全部系列</option></select>
      <button id="btnSearch">查询报价</button>
      <button id="btnClear" class="ghost">清空</button>
    </div>
    <div class="quick" id="quick"></div>
    <div class="stats">
      <div class="stat"><b id="statModel">0</b><span>收录型号数</span></div>
      <div class="stat"><b id="statSeries">0</b><span>覆盖系列</span></div>
      <div class="stat"><b id="statQuote">0</b><span>历史报价条数</span></div>
      <div class="stat"><b id="statOwn">0</b><span>自建补充数据</span></div>
    </div>
  </div>

  <!-- 结果区 -->
  <div id="results"></div>

  <!-- 补充数据 -->
  <h2 class="sec">补充新型号报价</h2>
  <div class="card">
    <div class="form-grid">
      <div class="field">
        <label>型号名称 *</label>
        <input id="fModel" placeholder="如：200AFP400-48-90">
      </div>
      <div class="field">
        <label>所属系列</label>
        <input id="fSeries" placeholder="如：AFP / BPO / QJ">
      </div>
      <div class="field">
        <label>参考单价（元）*</label>
        <input id="fPrice" type="number" min="0" step="any" placeholder="如：39353">
      </div>
      <div class="field">
        <label>备注（可选）</label>
        <input id="fNote" placeholder="如：含税/不含电机">
      </div>
    </div>
    <div class="form-actions">
      <button id="btnAdd">➕ 加入报价数据库</button>
      <button id="btnExport" class="ghost">导出我的数据</button>
      <span class="toast" id="toast"></span>
    </div>
    <div class="hint">
      提示：补充的数据保存在本机浏览器（localStorage），刷新页面不会丢失；导出后可备份到其他设备。
    </div>
    <div class="own-list" id="ownList"></div>
  </div>

</div>

/* =========================================================
   2. 工具函数
   ========================================================= */
const norm = s => String(s||'')
  .toLowerCase()
  .replace(/[（]/g,'(').replace(/[）]/g,')')
  .replace(/[×✕✖]/g,'*')
  .replace(/[－—–]/g,'-')
  .replace(/\s+/g,'')
  .trim();

const core = s => norm(s).replace(/[()\-_/*.,、]/g,'');

const fmt = n => '¥' + Math.round(n).toLocaleString('zh-CN');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function lev(a,b){
  if(a===b) return 0;
  const m=a.length,n=b.length;
  if(!m) return n; if(!n) return m;
  let prev=new Array(n+1),cur=new Array(n+1);
  for(let j=0;j<=n;j++) prev[j]=j;
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    }
    const t=prev;prev=cur;cur=t;
  }
  return prev[n];
}

/* 相似度打分：完全匹配 > 前缀 > 包含 > 编辑距离 */
function similarity(qc, mc){
  if(qc===mc) return 1;
  const Lmax = Math.max(qc.length, mc.length);
  if(mc.length>qc.length && mc.startsWith(qc)) return 0.93 + 0.06*qc.length/mc.length;
  if(qc.length>mc.length && qc.startsWith(mc)) return 0.90 + 0.05*mc.length/qc.length;
  if(mc.includes(qc)) return 0.80 + 0.15*qc.length/mc.length;
  if(qc.includes(mc)) return 0.75 + 0.15*mc.length/qc.length;
  let p=0; while(p<qc.length&&p<mc.length&&qc[p]===mc[p]) p++;
  const prefixScore = p/Lmax;
  const editScore = 1 - lev(qc,mc)/Lmax;
  return Math.max(prefixScore*0.92, editScore*0.86);
}

/* =========================================================
   3. 数据库构建
   ========================================================= */
const LS_KEY = 'pump_quote_custom_v1';

function loadCustom(){
  try{
    const a = JSON.parse(localStorage.getItem(LS_KEY) || '[]');
    return Array.isArray(a) ? a.filter(x=>x && x.model && isFinite(x.price) && x.price>0) : [];
  }catch(e){ return []; }
}
function saveCustom(list){
  localStorage.setItem(LS_KEY, JSON.stringify(list));
}

let DB = [];      // 聚合后的数据库
let CUSTOM = [];  // 自建数据

function rebuildDB(){
  const map = new Map();

  const push = (model, series, price, isCustom) => {
    if(!model || !isFinite(price) || price<=0) return;
    const key = norm(model);
    if(!key) return;
    if(!map.has(key)){
      map.set(key, { model: String(model).trim(), series: series||'其它', prices: [], custom: !!isCustom, key });
    }
    const rec = map.get(key);
    rec.prices.push(Math.round(price));
    if(isCustom) rec.custom = true;
    if(!rec.series || rec.series === '其它') if(series) rec.series = series;
  };

  RAW.forEach(([m,s,p]) => push(m,s,p,false));
  CUSTOM.forEach(c => push(c.model, c.series, c.price, true));

  DB = [...map.values()].map(r=>{
    const prices = [...new Set(r.prices)].sort((a,b)=>a-b);
    return {
      model: r.model, series: r.series, custom: r.custom, key: r.key,
      prices,
      min: prices[0],
      max: prices[prices.length-1],
      count: prices.length
    };
  });
}

/* =========================================================
   4. 搜索
   ========================================================= */
function search(rawQuery, seriesFilter){
  const q = norm(rawQuery);
  if(!q) return [];
  const qc = core(rawQuery);
  const out = [];
  for(const item of DB){
    if(seriesFilter && item.series !== seriesFilter) continue;
    let s = similarity(qc, core(item.model));
    // 若型号里不含系列词但系列名匹配，小幅加分
    if(s < 0.6 && norm(item.series) && norm(item.series) === q) s = Math.max(s, 0.62);
    if(s >= 0.55) out.push({ item, score: s });
  }
  out.sort((a,b)=>{
    if(Math.abs(b.score - a.score) > 0.001) return b.score - a.score;
    return a.item.model.localeCompare(b.item.model, 'zh');
  });
  return out.slice(0, 30);
}

/* =========================================================
   5. 渲染
   ========================================================= */
const $ = id => document.getElementById(id);
const resultsEl = $('results');

function priceText(it){
  if(it.min === it.max) return fmt(it.min);
  return fmt(it.min) + ' ~ ' + fmt(it.max);
}

function renderResults(list, query){
  if(!list.length){
    resultsEl.innerHTML = `
      <div class="empty">
        <b>未找到与「${esc(query)}」相关的型号</b>
        请尝试输入更短的关键字（如 AFP400、BPO250、200QJ65），<br>
        或在下方「补充新型号报价」中直接录入该型号价格。
      </div>`;
    return;
  }
  const exact = list.filter(x=>x.score >= 0.999);
  const sim   = list.filter(x=>x.score < 0.999);
  let html = '';

  const card = (x, isSelf) => {
    const it = x.item;
    const pct = Math.round(x.score*100);
    return `
      <div class="res-card${isSelf?' self':''}">
        <div class="res-top">
          <span class="model">${esc(it.model)}</span>
          <span class="badge">${esc(it.series||'其它')}</span>
          ${it.custom?'<span class="badge own">自建</span>':''}
          <span class="match">匹配度 ${pct}%</span>
        </div>
        <div class="price">${priceText(it)}
          <small>${it.count>1?'共 '+it.count+' 条历史报价':'参考报价'}</small>
        </div>
        <div class="meta">指导价仅供参考，实际以最终技术方案与商务报价为准</div>
      </div>`;
  };

  if(exact.length){
    html += `<h2 class="sec">完全匹配</h2><div class="res">${exact.map(x=>card(x,true)).join('')}</div>`;
  }
  if(sim.length){
    html += `<h2 class="sec">相似型号（${sim.length}）</h2><div class="res">${sim.map(x=>card(x,false)).join('')}</div>`;
  }
  resultsEl.innerHTML = html;
}

/* =========================================================
   6. 初始化 UI
   ========================================================= */
function refreshStats(){
  $('statModel').textContent = DB.length;
  $('statSeries').textContent = new Set(DB.map(d=>d.series)).size;
  $('statQuote').textContent = RAW.filter(r=>r[2]>0).length + CUSTOM.length;
  $('statOwn').textContent = CUSTOM.length;
}

function refreshSeriesOptions(){
  const sel = $('series');
  const cur = sel.value;
  const list = [...new Set(DB.map(d=>d.series))].filter(Boolean).sort((a,b)=>a.localeCompare(b,'zh'));
  sel.innerHTML = '<option value="">全部系列</option>' +
    list.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');
  if(list.includes(cur)) sel.value = cur;
}

function renderOwnList(){
  const el = $('ownList');
  if(!CUSTOM.length){ el.innerHTML = ''; return; }
  el.innerHTML = CUSTOM.map((c,i)=>`
    <div class="own-item">
      <span class="n">${esc(c.model)}</span>
      ${c.series?`<span class="s">${esc(c.series)}</span>`:''}
      ${c.note?`<span style="color:#94a3b8;font-size:12.5px">${esc(c.note)}</span>`:''}
      <span class="p">${fmt(c.price)}</span>
      <button class="danger" data-i="${i}">删除</button>
    </div>`).join('');
  el.querySelectorAll('button.danger').forEach(btn=>{
    btn.onclick = () => {
      const i = +btn.dataset.i;
      CUSTOM.splice(i,1);
      saveCustom(CUSTOM);
      rebuildDB();
      refreshStats(); refreshSeriesOptions(); renderOwnList();
      showToast('已删除该条数据','ok');
      const q = $('q').value.trim();
      if(q) doSearch();
      else resultsEl.innerHTML = '';
    };
  });
}

let toastTimer = null;
function showToast(msg, type){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.className = 'toast'; t.textContent=''; }, 2600);
}

/* --------- 事件绑定 --------- */
function doSearch(){
  const q = $('q').value.trim();
  const sf = $('series').value;
  if(!q && !sf){
    resultsEl.innerHTML = '';
    return;
  }
  if(!q){
    // 只选了系列：列出该系列前 30 个型号
    const list = DB.filter(d=>d.series===sf)
      .sort((a,b)=>a.model.localeCompare(b.model,'zh'))
      .slice(0,30)
      .map(item=>({item, score:0.99}));
    renderResults(list, sf + ' 系列');
    return;
  }
  const list = search(q, sf);
  renderResults(list, q);
}

$('btnSearch').onclick = doSearch;
$('q').addEventListener('keydown', e => { if(e.key === 'Enter') doSearch(); });
$('series').addEventListener('change', ()=>{ if($('q').value.trim()) doSearch(); });
$('btnClear').onclick = ()=>{
  $('q').value=''; $('series').value=''; resultsEl.innerHTML=''; $('q').focus();
};

/* 快捷标签 */
const QUICK = ['AFP','BPO','QJ','CZ','ZA','IS','IH','WL','DG','电机','耦合装置'];
$('quick').innerHTML = '<span class="lbl">常用系列：</span>' +
  QUICK.map(k=>`<span class="chip" data-k="${k}">${k}</span>`).join('');
$('quick').querySelectorAll('.chip').forEach(c=>{
  c.onclick = ()=>{ $('q').value = c.dataset.k; doSearch(); };
});

/* 添加数据 */
$('btnAdd').onclick = () => {
  const model = $('fModel').value.trim();
  const series = $('fSeries').value.trim();
  const price = parseFloat($('fPrice').value);
  const note = $('fNote').value.trim();

  if(!model){ showToast('请填写型号名称','err'); $('fModel').focus(); return; }
  if(!isFinite(price) || price <= 0){ showToast('请填写有效的参考单价','err'); $('fPrice').focus(); return; }

  CUSTOM.push({ model, series, price, note, ts: Date.now() });
  saveCustom(CUSTOM);
  rebuildDB();
  refreshStats(); refreshSeriesOptions(); renderOwnList();

  $('fModel').value=''; $('fSeries').value=''; $('fPrice').value=''; $('fNote').value='';
  showToast('✅ 已加入报价数据库','ok');

  $('q').value = model;
  doSearch();
};

/* 导出 */
$('btnExport').onclick = () => {
  if(!CUSTOM.length){ showToast('暂无自建数据可导出','err'); return; }
  const blob = new Blob([JSON.stringify(CUSTOM, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '我的水泵报价数据_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
};

/* --------- 启动 --------- */
CUSTOM = loadCustom();
rebuildDB();
refreshStats();
refreshSeriesOptions();
renderOwnList();
</script>
